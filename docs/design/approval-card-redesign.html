<!doctype html>
<!-- Design draft only. Assumptions: existing Neo theme; two direct decisions; owner reviews before implementation.
Offline, no imports/fonts/network. Real commands are inert text. Theme values copied from renderer themes at author time. -->
<html lang="zh-CN" data-theme="light"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data:; connect-src 'none'; font-src 'none'; base-uri 'none'; form-action 'none'">
<title>Neo · 审批卡设计草稿</title><style>:root[data-theme="light"]{--bg-void:#FFFFFF;--bg-deep:#FAFAFA;--bg-surface:#F4F4F5;--bg-elevated:#FFFFFF;--bg-hover:#EBEBED;--text-primary:#18181B;--text-secondary:#52525B;--text-tertiary:#71717A;--text-inverse:#F4F4F5;--brand-primary:#0F766E;--brand-primary-hover:#115E59;--badge-danger-fg:#B91C1C;--badge-danger-bg:#FEF2F2;--badge-danger-border:rgba(185, 28, 28, 0.35);--border-default:rgba(0, 0, 0, 0.08);--border-subtle:rgba(0, 0, 0, 0.04);--accent-accessible:var(--brand-primary);}
:root[data-theme="dark"]{--bg-void:#101012;--bg-deep:#141417;--bg-surface:#18181B;--bg-elevated:#1F1F23;--bg-hover:#27272B;--text-primary:#F4F4F5;--text-secondary:#A1A1AA;--text-tertiary:#71717A;--text-inverse:#18181B;--brand-primary:#0F766E;--brand-primary-hover:#115E59;--badge-danger-fg:#FCA5A5;--badge-danger-bg:rgba(239, 68, 68, 0.15);--badge-danger-border:rgba(239, 68, 68, 0.35);--border-default:rgba(255, 255, 255, 0.08);--border-subtle:rgba(255, 255, 255, 0.04);--accent-accessible:var(--brand-primary);}
:root{--radius-xl:8px;--radius-2xl:12px;--space-4:16px;--space-6:24px;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color-scheme:light}
:root[data-theme="dark"]{color-scheme:dark}
*{box-sizing:border-box}body{margin:0;background:var(--bg-deep);color:var(--text-primary);font-size:14px;line-height:1.6}button,input,summary{font:inherit}button,summary{cursor:pointer}button{color:inherit}button:focus-visible,summary:focus-visible,a:focus-visible,.card:focus-visible{outline:3px solid var(--accent-accessible);outline-offset:4px}
button{border:1px solid var(--border-default);background:var(--bg-elevated);border-radius:var(--radius-xl);padding:10px 18px;min-height:44px;font-weight:500}button:hover{background:var(--bg-hover)}button:disabled{opacity:.65;cursor:default}a{color:var(--accent-accessible)}
.wrap{max-width:1200px;margin:auto;padding:34px 32px 44px}.top{display:flex;justify-content:space-between;gap:16px;align-items:center;border-bottom:1px solid var(--border-default);padding-bottom:22px}.wordmark{font-size:23px;font-weight:650;letter-spacing:-.7px}.brand-dot{display:inline-block;width:9px;height:9px;background:var(--brand-primary);border-radius:50%;margin-right:9px}.review{color:var(--text-secondary);font-size:12px;margin-left:13px;letter-spacing:0}.top button{font-size:13px;padding:6px 12px}.intro{margin:30px 0 26px;max-width:680px}h1{font-size:30px;letter-spacing:-.8px;line-height:1.3;margin:0 0 10px;font-weight:600}.intro p{margin:0;color:var(--text-secondary)}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:28px 24px}.sample{min-width:0}.sample-label{margin:0 0 10px;font-size:12px;font-weight:500;color:var(--text-secondary);display:flex;justify-content:space-between;gap:12px}.sample-label span:last-child{color:var(--text-tertiary)}
.frame{background:var(--bg-void);border:1px solid var(--border-default);border-radius:var(--radius-2xl);overflow:clip;min-height:302px}.context{padding:14px 18px;border-bottom:1px solid var(--border-subtle);font-size:12px;color:var(--text-secondary);display:flex;gap:9px;align-items:center}.context .brand-dot{width:6px;height:6px;margin:0}.chat{padding:18px}.user{font-size:12px;color:var(--text-secondary);text-align:right;margin:0 0 17px}.user span{background:var(--bg-surface);padding:8px 12px;display:inline-block;border-radius:var(--radius-xl)}
.card{padding:20px;border:1px solid var(--border-default);border-radius:var(--radius-2xl);background:var(--bg-elevated);overflow-wrap:anywhere}.eyebrow{font-size:11px;color:var(--text-secondary);margin-bottom:9px;display:flex;gap:7px;align-items:center}.status-dot{height:5px;width:5px;background:var(--text-secondary);border-radius:50%}.sentence{font-size:16px;line-height:1.65;margin:0;font-weight:500;letter-spacing:-.15px}.actions{display:flex;gap:9px;margin-top:20px}.actions button{flex:1;padding:10px 9px}.allow{background:var(--brand-primary);color:#fff;border-color:transparent}.allow:hover{background:var(--brand-primary-hover)}.danger .allow{color:var(--badge-danger-fg);background:var(--badge-danger-bg);border-color:var(--badge-danger-border)}.danger .allow:hover{background:var(--bg-hover)}.danger .deny{background:var(--brand-primary);color:#fff;border-color:transparent}.consequence{background:var(--badge-danger-bg);color:var(--badge-danger-fg);padding:10px 12px;border-radius:var(--radius-xl);font-size:13px;margin:12px 0 0;border-left:2px solid var(--badge-danger-fg)}
details{margin-top:12px}summary{color:var(--text-secondary);font-size:12px;min-height:36px;display:flex;gap:7px;align-items:center;list-style:none;width:fit-content;max-width:100%}summary::-webkit-details-marker{display:none}summary:before{content:'›';font-size:18px;line-height:1;transition:transform .15s}details[open]>summary:before{transform:rotate(90deg)}.advanced{padding-top:8px;border-top:1px solid var(--border-default);margin-top:3px}.advanced p{font-size:12px;color:var(--text-secondary);margin:10px 0}.advanced .scope-note{font-size:11px}.advanced fieldset{border:0;margin:0;padding:0}legend{color:var(--text-secondary);font-size:12px;padding:0;margin:7px 0}label{display:flex;align-items:flex-start;gap:8px;font-size:12px;padding:7px 0}input{accent-color:var(--brand-primary);margin:4px 0 0;flex:none}pre{margin:8px 0;background:var(--bg-deep);border:1px solid var(--border-subtle);border-radius:var(--radius-xl);padding:12px;font:11px/1.65 ui-monospace,Menlo,monospace;white-space:pre-wrap;overflow-wrap:anywhere;word-break:break-word;max-width:100%}.detail-name{font-size:11px;color:var(--text-tertiary)}.card .result{font-size:14px;margin:0;color:var(--text-secondary)}.narrow .frame{width:390px;max-width:100%}.read-note{margin:0;font-size:14px;font-weight:500}.read-line{margin-top:16px;background:var(--bg-surface);border-radius:var(--radius-xl);padding:15px;font-size:13px;color:var(--text-secondary)}.read-line .brand-dot{width:6px;height:6px;margin-right:7px}.foot{margin:28px 0 0;padding-top:18px;border-top:1px solid var(--border-default);font-size:12px;color:var(--text-secondary)}
@media(max-width:700px){.wrap{padding:20px 16px 28px}.grid{grid-template-columns:minmax(0,1fr);gap:24px}.top{align-items:flex-start}.review{display:block;margin:3px 0 0;font-size:11px}h1{font-size:26px}.intro{margin:25px 0}.chat{padding:12px}.card{padding:16px}.sentence{font-size:15px}.frame{min-height:0}.sample-label span:last-child{max-width:48%;text-align:right}.actions button{font-size:13px}.top button{white-space:nowrap}.narrow .frame{width:100%}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style></head><body><main class="wrap">
<header class="top"><div class="wordmark"><span class="brand-dot"></span>Neo<span class="review">草稿·待爸拍板</span></div><button id="theme" type="button">切换为深色</button></header>
<div class="intro"><h1>只在需要你决定时，停一下。</h1><p>先看懂会发生什么，再决定要不要继续。命令和授权范围，留在展开之后。</p></div>
<div class="grid" id="samples"></div>
<footer class="foot">交互草稿 · 按钮可试点，折叠项可展开，主题可切换。页面不会执行文件操作，也不会保存授权。</footer>
</main><script>
const zh={status:'需要你确认',more:'更多选项与详情',deny:'暂不',allow:'写入',once:'仅这一次',run:'到这次任务完成',day:'24 小时内',legend:'允许多久',scope:'范围：写文件，包含其他文件；24 小时授权也用于其他任务。原有确认限制仍有效。',raw:'原始操作',shortcuts:'键盘操作',keys:'聚焦此卡后可用 Y 允许这次、N 暂不；展开后 S 选择任务内、A 选择 24 小时，再用主按钮确认。输入文字时不触发。',done:'本次写入已允许',stopped:'本次操作已取消',grantRun:'允许至任务结束',grantDay:'允许 24 小时'};
const en={status:'Your approval',more:'More options & details',deny:'Not now',allow:'Write file',once:'This time only',run:'Until this task ends',day:'For 24 hours',legend:'Allow for',scope:'Scope: file writes, including other files and (for 24 hours) other tasks. Existing confirmation rules still apply.',raw:'Raw operation',shortcuts:'Keyboard controls',keys:'Focus this card: Y allows once, N declines. With options open, S selects this task and A selects 24 hours; confirm with the main button. Typing never triggers these keys.',done:'This write was allowed',stopped:'This action was cancelled',grantRun:'Allow for this task',grantDay:'Allow for 24 hours'};
const configs=[
{id:'ordinary',label:'01 / 普通写入',hint:'默认收起',task:'帮我提取这份合同的要点。',context:'合同要点整理',sentence:'Neo 将把合同要点写进「合同要点摘录.md」。',raw:'文件：./合同要点摘录.md\n操作：创建新文件\n内容：合同期限、付款方式与终止条款'},
{id:'danger',label:'02 / 真实危险',hint:'仅一次确认',task:'把工作文件夹外的两个导出缓存删掉。',context:'整理导出文件',sentence:'Neo 将删除工作文件夹外的两个导出缓存文件。',danger:true,raw:'~/Downloads/导出缓存-A.tmp\n~/Documents/导出缓存-B.tmp\nrm -- "$HOME/Downloads/导出缓存-A.tmp" "$HOME/Documents/导出缓存-B.tmp"'},
{id:'expanded',label:'03 / 详情展开',hint:'主动查看时才出现',task:'帮我提取这份合同的要点。',context:'合同要点整理',sentence:'Neo 将把合同要点写进「合同要点摘录.md」。',open:true,raw:'文件：./合同要点摘录.md\n操作：创建新文件\n参数：overwrite=false\n原始操作：Write({path:"./合同要点摘录.md", content:"…", overwrite:false})'},
{id:'english',label:'04 / English UI',hint:'Full English interface',task:'Summarize this contract.',context:'Contract summary',sentence:'Neo will write the contract highlights to “Contract summary.md”.',en:true,raw:'File: ./Contract summary.md\nAction: create a new file\nContents: term, payment and termination'},
{id:'narrow',label:'05 / 窄窗口',hint:'390 px，自适应',task:'帮我提取这份合同的要点。',context:'合同要点整理',sentence:'Neo 将把合同要点写进「合同要点摘录.md」。',raw:'文件：./合同要点摘录.md\n操作：创建新文件'},
{id:'readonly',label:'06 / 只读探测',hint:'没有审批卡',task:'这份合同讲什么？',context:'合同要点整理',read:true}
];
const escape=s=>s.replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;');
for(const x of configs){const t=x.en?en:zh;const section=document.createElement('section');section.className='sample '+x.id;section.id=x.id;
const card=x.read?'<p class="read-note">正在读取你上传的合同</p><div class="read-line"><span class="brand-dot"></span>检查文件并提取文字</div>':`<article class="card ${x.danger?'danger':''}" tabindex="0" aria-label="${t.status}" data-state="${x.id}" lang="${x.en?'en':'zh-CN'}"><div class="eyebrow"><span class="status-dot"></span>${t.status}</div><p class="sentence">${x.sentence}</p>${x.danger?'<p class="consequence">这两个文件将被永久删除，无法从废纸篓找回。</p>':''}<div class="actions"><button class="deny" data-decision="deny" aria-keyshortcuts="N">${t.deny}</button><button class="allow" data-decision="allow" aria-keyshortcuts="Y">${x.danger?'删除这两个文件':t.allow}</button></div><details class="more" ${x.open?'open':''}><summary>${t.more}</summary><div class="advanced">${x.danger?'':`<fieldset><legend>${t.legend}</legend>${[['once',t.once],['run',t.run],['24h',t.day]].map(([v,label])=>`<label><input type="radio" name="tier-${x.id}" value="${v}" ${v==='once'?'checked':''}>${label}</label>`).join('')}</fieldset><p class="scope-note">${t.scope}</p>`}<details class="raw" ${x.open?'open':''}><summary>${t.raw}</summary><pre>${escape(x.raw)}</pre></details><details class="keyboard"><summary>${t.shortcuts}</summary><p>${x.danger?'聚焦此卡后可用 Y 允许这次、N 暂不；不支持持续授权。输入文字时不触发。':t.keys}</p></details></div></details></article>`;
section.innerHTML=`<h2 class="sample-label"><span>${x.label}</span><span>${x.hint}</span></h2><div class="frame" ${x.en?'lang="en"':''}><div class="context"><span class="brand-dot"></span>${x.context}</div><div class="chat"><p class="user"><span>${x.task}</span></p>${card}</div></div>`;
document.getElementById('samples').append(section);
const c=section.querySelector('.card');if(!c)continue;
const button=c.querySelector('.allow');c.querySelectorAll('input').forEach(input=>input.addEventListener('change',()=>{button.textContent=input.value==='run'?t.grantRun:input.value==='24h'?t.grantDay:t.allow}));
function decide(allow,forceOnce=false){const tier=forceOnce?'once':c.querySelector('input:checked')?.value||'once';c.dataset.decision=allow?tier:'deny';c.replaceChildren();const p=document.createElement('p');p.className='result';p.setAttribute('role','status');p.textContent=allow?(x.danger?'本次删除已允许':tier==='run'?t.grantRun:tier==='24h'?t.grantDay:t.done):t.stopped;c.append(p)}
c.querySelectorAll('[data-decision]').forEach(b=>b.addEventListener('click',()=>decide(b.dataset.decision==='allow')));
c.addEventListener('keydown',e=>{if(e.target.closest('input,textarea,[contenteditable="true"]')||e.ctrlKey||e.altKey||e.metaKey||e.repeat||c.dataset.decision)return;const k=e.key.toLowerCase();if(k==='y'||k==='n'){e.preventDefault();decide(k==='y',true)}else if((k==='s'||k==='a')&&!x.danger&&c.querySelector('.more').open){e.preventDefault();const input=c.querySelector(`input[value="${k==='s'?'run':'24h'}"]`);input.checked=true;input.dispatchEvent(new Event('change'))}});
}
const themeButton=document.getElementById('theme');function setTheme(mode){document.documentElement.dataset.theme=mode;themeButton.textContent=mode==='dark'?'切换为浅色':'切换为深色';themeButton.setAttribute('aria-pressed',String(mode==='dark'))}
setTheme(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light');themeButton.addEventListener('click',()=>setTheme(document.documentElement.dataset.theme==='dark'?'light':'dark'));
</script></body></html>
